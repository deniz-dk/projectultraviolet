<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{background:transparent;font-family:Archivo}
.tile{position:relative;overflow:hidden;
 background:linear-gradient(180deg,#232427 0%,#151517 55%,#0e0e10 100%);}
.tile::after{content:"";position:absolute;inset:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.tile svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.og{width:1200px;height:630px;display:flex;align-items:center;gap:56px;padding:0 96px;color:#fff}
.og .mark{width:220px;height:220px;border-radius:50px;flex:none;position:relative;
 box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 16px rgba(0,0,0,.4)}
.og h1{font-weight:800;font-stretch:70%;font-size:118px;line-height:.95;letter-spacing:.005em;text-transform:uppercase}
.og p{margin-top:22px;font-size:34px;line-height:1.3;color:rgba(255,255,255,.72);max-width:700px}
.og p b{color:#fff;font-weight:700}
.og .url{margin-top:26px;font-size:24px;font-weight:700;letter-spacing:.06em;color:#a78bfa;text-transform:uppercase}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="vio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
 <filter id="raise" x="-30%" y="-30%" width="160%" height="170%">
  <feOffset in="SourceAlpha" dx="0" dy=".55" result="dn"/><feComposite in="SourceAlpha" in2="dn" operator="out" result="top"/>
  <feFlood flood-color="#ffffff" flood-opacity=".22"/><feComposite in2="top" operator="in" result="topc"/>
  <feOffset in="SourceAlpha" dx="0" dy="-.8" result="up"/><feComposite in="SourceAlpha" in2="up" operator="out" result="bot"/>
  <feFlood flood-color="#1e1b6b" flood-opacity=".9"/><feComposite in2="bot" operator="in" result="botc"/>
  <feDropShadow in="SourceAlpha" dx="0" dy="1.4" stdDeviation="1.3" flood-color="#000" flood-opacity=".7" result="ds"/>
  <feMerge><feMergeNode in="ds"/><feMergeNode in="SourceGraphic"/><feMergeNode in="topc"/><feMergeNode in="botc"/></feMerge>
 </filter>
</defs></svg>
<script>
const mark=(px,raised)=>`<svg width="${px}" height="${px}" viewBox="0 0 64 64"><g ${raised?'filter="url(#raise)"':''}><circle cx="32" cy="32" r="27.6" fill="${raised?'none':'#0d0d0f'}" stroke="${raised?'url(#vio)':'url(#vio)'}" stroke-width="6.2"/><text x="32" y="41.6" text-anchor="middle" font-family="Archivo" font-weight="850" style="font-stretch:112%;paint-order:stroke" stroke="${raised?'url(#vio)':'url(#vio)'}" stroke-width="0.5" stroke-linejoin="round" font-size="26" fill="${raised?'url(#vio)':'url(#vio)'}">uV</text></g></svg>`;
window.make=(kind,size)=>{document.body.innerHTML+= '';const d=document.createElement('div');d.id='o';
 if(kind==='tile'){d.className='tile';d.style.cssText=`width:${size}px;height:${size}px`;d.innerHTML=mark(Math.round(size*.8),1)}
 else if(kind==='fav'){d.style.cssText=`width:${size}px;height:${size}px`;d.innerHTML=mark(size,0)}
 else{d.className='tile og';d.innerHTML=`<div class="tile mark" style="position:relative">${mark(180,1)}</div><div><h1>Project UltraViolet</h1><p><b>Your way into Canadian medicine.</b> Requirements, interviews, timelines and coaching for every Canadian medical school.</p><div class="url">projectuv.com</div></div>`;d.querySelector('.mark').classList.add('tile')}
 document.querySelectorAll('#o').forEach(x=>x.remove());document.body.appendChild(d)};
</script></body></html>
